<style>
:root{--bg:#dcdfe2;--card:#fff;--tx:#101c24;--mu:#5a6a74;--ac:#e5640d;--bd:#d6dee3;--ok:#1d8a4e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1418;--card:#15212a;--tx:#e8eff3;--mu:#97a8b2;--ac:#ff8a3d;--bd:#26363f;--ok:#4cc57e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1418;--card:#15212a;--tx:#e8eff3;--mu:#97a8b2;--ac:#ff8a3d;--bd:#26363f;--ok:#4cc57e;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.45}
h1,h2,h3{font-family:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;margin:0}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 40px}
header h1{font-size:40px;line-height:1.05}
header p{margin:8px auto 0;max-width:30ch;color:var(--mu)}
.tabs{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:20px 0 18px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.tab,.tl{border:1.5px solid var(--bd);background:var(--card);padding:9px 16px;border-radius:999px;font-weight:600}
.tab[aria-pressed="true"],.tl[aria-pressed="true"]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:8px 0 18px}
.card{background:var(--card);border:1.5px solid var(--bd);border-radius:14px;overflow:hidden;text-align:left;padding:0;display:block;width:100%}
.card svg,.big svg{display:block;width:100%;height:auto}
.card .in{padding:10px 12px 12px}
.card h3{font-size:22px}
.meta{color:var(--mu);font-size:14px}
.done{color:var(--ok);font-weight:600}
.back{border:0;background:none;padding:8px 0;font-weight:600;color:var(--ac);font-size:16px}
.big{border-radius:14px;overflow:hidden;border:1.5px solid var(--bd);margin:8px 0}
.big.ed{cursor:default;touch-action:none;-webkit-user-select:none;user-select:none}
ol{padding-left:22px;margin:8px 0 16px}
ol li{margin:6px 0}
.cta{width:100%;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:17px;margin-top:8px}
.btn{border:1.5px solid var(--bd);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tl{padding:6px 12px;font-size:14px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--card);border:1.5px solid var(--bd);border-radius:10px;padding:10px 12px}
select{width:auto}
input[type=number]{width:90px}
textarea{margin-top:8px}
.day{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.day input{width:24px;height:24px;margin-top:2px;accent-color:var(--ok);flex:none}
.day h3{font-size:22px}
.links{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.lk{display:inline-flex;border:1.5px solid var(--bd);border-radius:8px;overflow:hidden;background:var(--bg)}
.lk button{border:0;background:none;padding:4px 10px;font-size:14px}
.danger{color:#d6403a;border-color:#d6403a}
.pl{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--bd);border-radius:12px;padding:8px 12px;margin-bottom:8px}
.num{flex:none;min-width:38px;height:38px;border-radius:50%;background:var(--ac);color:#fff;font-family:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;font-weight:700;font-size:22px;display:grid;place-items:center}
.num.none{background:var(--bd);color:var(--mu)}
.pl .nm{flex:1;font-weight:600}
.pl .btn{padding:4px 10px;font-size:14px}
.form{display:grid;gap:8px;background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:12px;margin:8px 0 16px}
.form .one{display:flex;gap:5px;align-items:stretch}.form .one>input{min-width:0}.form .one input,.form .one select{padding-left:8px;padding-right:4px;font-size:14px}.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 18px}.catb{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:118px;padding:14px 14px 12px;border:1.5px solid var(--bd);border-left:7px solid var(--cc);border-radius:16px;background:var(--card);text-align:left;font:inherit;box-shadow:0 2px 8px #0000000f;transition:transform .12s,box-shadow .12s}.catb:active{transform:scale(.97)}.catb .ci{font-size:30px;line-height:1}.catb .cn{font-family:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;font-size:19px;font-weight:700;line-height:1.1;margin-top:2px;overflow-wrap:break-word}.catb.new{background:#6cbf3a;color:#000}.catb.new .cc{background:#000}.catb .cc{margin-top:auto;background:var(--cc);color:#fff;font-weight:700;font-size:13px;padding:3px 10px;border-radius:999px}
.calhd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 10px}.calhd h2{margin:0;font-size:30px}.calhd .btn{font-size:22px;padding:2px 16px;line-height:1.3}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cw{text-align:center;font-weight:700;font-size:13px;color:var(--mu);padding:4px 0}.cw.we{color:#d6403a}
.cd{aspect-ratio:1/1;display:grid;place-items:center;border-radius:10px;background:var(--card);border:1.5px solid var(--bd);font-weight:600;font-size:16px}.cd.e{background:none;border:0}.cd.we{color:#8a6a6a}
.cd.hol{background:#d6403a;border-color:#b3302b;color:#fff}.cd.fer{background:#bfe5a8;border-color:#7cc457;color:#1d5a14}.cd.bus{background:#e3d4f7;border-color:#bf9fe6;color:#4a2b7a}.cd.td{outline:3px solid var(--ac);outline-offset:1px}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px;border:1px solid #0003}.sw.hol{background:#d6403a}.sw.fer{background:#bfe5a8;border-color:#7cc457}.sw.bus{background:#e3d4f7;border-color:#bf9fe6}.lg{font-size:13px;font-weight:600;display:inline-flex;align-items:center}
.calh{font-size:22px;margin:18px 0 6px}.cl{list-style:none;padding:0;margin:0}.cl li{padding:6px 0;border-bottom:1px solid var(--bd)}
.form .two label{display:flex;flex-direction:column;gap:3px;min-width:0}.form input[type=time]{width:100%;background:var(--card);border:1.5px solid var(--bd);border-radius:10px;padding:10px 12px;font:inherit;color:inherit}
.cd{position:relative}button.cd{font:inherit;font-weight:600;color:var(--tx);cursor:pointer;padding:0}.cd .pd,.pd{position:absolute;bottom:4px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--ac);border:1px solid #fff}
.sw.tr{background:var(--ac)}.lnk{border:0;background:none;font:inherit;text-align:left;padding:0;width:100%;color:inherit}
.tagl{margin:2px 0;font-weight:700;font-size:14px}.tagh{color:#d6403a}.tagf{color:#2b7a1f}
.sumbar{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:4px}.sumbar.over b,.sumbar.over span{color:#d6403a}.sumbar span{color:#2b7a1f;font-weight:700}
.bar{height:10px;border-radius:6px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:#6cbf3a}
.pi{display:flex;gap:10px;align-items:center;background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:8px;margin-bottom:8px}.pit{flex:none;width:84px;border-radius:8px;overflow:hidden;line-height:0}.pit svg{width:100%;height:auto}
.tsel{display:flex;align-items:center;gap:6px;margin-top:3px}.tsel select{flex:1;width:auto;min-width:0}.pnum{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ac);color:#fff;font-weight:700;display:grid;place-items:center}
.pib{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.pib b{font-size:16px;line-height:1.2}.pib input{padding:4px 8px}.pia{display:flex;flex-direction:column;gap:4px}.pia .btn{padding:2px 10px;line-height:1.3}.pia .btn:disabled{opacity:.35}
.pick{background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:8px 10px;margin:0 0 12px}.pick h4{margin:10px 0 4px;font-size:15px;color:var(--mu)}.pk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;font:inherit;padding:6px 0;border-bottom:1px solid var(--bd)}.pk span:nth-child(2){flex:1;display:flex;flex-direction:column}.pk .plus{font-size:26px;font-weight:700;color:var(--ac);padding:0 6px}
.ck{position:absolute;top:1px;right:3px;font-style:normal;font-size:12px;font-weight:800;color:#1d8a2e;line-height:1}.cd.hol .ck{color:#fff}
.btn.on{background:#6cbf3a;color:#000;border-color:#4c9a24}
.trk{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:12px;margin:8px 0}.trk input{width:26px;height:26px;accent-color:#2b8c55;flex:none}
.wd{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--bd);border-left:7px solid #2b8c55;border-radius:14px;padding:10px 12px;margin-bottom:10px;font:inherit;color:inherit}.wd.tdy{border-color:var(--ac);border-left-color:var(--ac)}
.wdh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:17px}.wdh span{color:var(--mu);font-size:14px;font-weight:600}
.wol{list-style:none;padding:0;margin:6px 0 0}.wol li{padding:4px 0;border-top:1px solid var(--bd);font-weight:600}.wol li span{color:var(--ac);font-size:13px;font-weight:700;margin-right:4px}.wol li i{font-style:normal;color:var(--mu);font-weight:600;float:right}
.skin{display:flex;gap:6px;align-items:center}.skin[hidden]{display:none}.skin button{display:flex;align-items:center;gap:5px;padding:3px 9px;border:2px solid var(--line,#d5dde3);border-radius:10px;background:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer}.skin button.on{border-color:#0f1c24;background:#eaf3ee}.skin i{width:14px;height:14px;border-radius:50%;border:1px solid #0004}
.gsel{display:flex;gap:5px;flex:none}.form .one select{flex:1;width:auto}.gsel button{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:6px;padding:3px 6px;border:2px solid var(--line,#d5dde3);border-radius:10px;background:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer}.gsel button.on{border-color:#0f1c24;background:#eaf3ee}.gsel svg{width:22px;height:32px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form select,.form input[type=number]{width:100%}
.warn{color:#d6403a;font-size:14px;margin:0}
h2.grp{font-size:22px;margin:14px 0 8px}
.reset{margin-top:6px;border:0;background:none;color:var(--mu);text-decoration:underline;font-size:14px}
.hdr{text-align:center}
.logo{margin:0 0 4px;line-height:0}.logo img{width:min(210px,58vw);height:auto;display:inline-block}
.brand{font-family:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;font-size:62px;font-weight:800;font-style:italic;line-height:1;letter-spacing:.5px;margin:2px 0 0;text-transform:none}
.brand .b1{color:var(--tx);font-weight:600}.brand .b2{background:linear-gradient(135deg,#ff9a1f,#e5400d);-webkit-background-clip:text;background-clip:text;color:transparent;text-transform:uppercase;margin-left:3px;filter:drop-shadow(0 2px 0 #0f1c2418)}
.brandbar{display:flex;justify-content:center;gap:5px;margin:6px 0 10px}.brandbar i{display:block;height:5px;width:34px;border-radius:3px;background:#2b8c55;transform:skewX(-25deg)}.brandbar i:nth-child(2){background:#e5640d}.brandbar i:nth-child(3){background:#0f1c24}
.club{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:nowrap;margin:0 0 6px}.club .ml{font-weight:700;font-size:14px;flex:none}
.club input{width:auto;flex:1 1 0;max-width:190px;font-size:14px;min-width:0;background:transparent;border:0;border-bottom:2px solid var(--bd);border-radius:0;padding:4px 6px;text-align:center;font:inherit;font-weight:600;color:inherit}.club input:focus{outline:0;border-bottom-color:var(--ac)}
.home{flex:none;width:46px;height:46px;border-radius:14px;border:1.5px solid var(--bd);background:var(--card);display:grid;place-items:center;color:var(--tx);padding:0}
.home[hidden]{display:none}.hbtns{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px}.hbtns[hidden]{display:none}
html{scroll-behavior:smooth}
.tab,.tl,.btn,.cta,.home,.card{transition:transform .15s ease,background-color .2s ease,color .2s ease,border-color .2s ease,box-shadow .2s ease}
.card{box-shadow:0 1px 2px #0a1a2410,0 6px 18px -8px #0a1a2428}
@media (hover:hover){.card:hover{transform:translateY(-2px);box-shadow:0 2px 4px #0a1a2412,0 14px 26px -10px #0a1a2440}.btn:hover,.tab:hover,.home:hover{border-color:var(--ac)}}
.card:active,.btn:active,.cta:active,.tab:active,.home:active{transform:scale(.97)}
#main>*{animation:vin .22s ease both}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.pitchwrap{border-radius:14px;overflow:hidden;border:1.5px solid var(--bd);margin:8px auto;max-width:420px;background:#2b8c55}.pitchwrap svg{display:block;width:100%;height:auto;-webkit-user-select:none;user-select:none}.sel2{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:420px;margin:0 auto 6px}.sel2 select{width:100%;margin-top:4px}.sel2 select:disabled{opacity:.55}
.sub{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--bg);border:1.5px solid var(--bd);font-size:12px;font-weight:700;color:var(--mu)}
#ps{margin-top:8px;width:100%}
.colors{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.colors:empty{display:none}
.sw{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--bd);background:var(--card);border-radius:999px;padding:5px 13px 5px 6px;font-size:14px;font-weight:600}
.sw i{width:22px;height:22px;border-radius:50%;border:1.5px solid #15151a66;display:inline-block}
.sw[aria-pressed=true]{border-color:var(--tx);background:var(--bg);box-shadow:0 0 0 1.5px var(--tx)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;border:1px solid #15151a66;vertical-align:-1px}
.bankbox{margin-top:14px;padding:12px 14px;border:2px dashed var(--bd);border-radius:14px;background:var(--card);transition:border-color .2s,background-color .2s}
.bankbox.over{border-color:var(--ac);background:#e5640d1a}
.bankhd{font-family:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;font-size:26px;font-weight:700;line-height:1.1}
.bankbox .btn{touch-action:none}
.dropbank{position:fixed;left:12px;right:calc(50% + 4px);bottom:12px;height:58px;border-radius:14px;background:var(--tx);color:var(--bg);display:grid;place-items:center;font-weight:700;z-index:20;border:2px dashed var(--ac);box-shadow:0 6px 20px #0004}
.dropbank[hidden]{display:none}.dropres{left:calc(50% + 4px);right:12px}
.dropbank.over{background:var(--ac);color:#fff}
.figghost{position:fixed;z-index:30;pointer-events:none;transform:translate(-50%,-70%);filter:drop-shadow(0 6px 8px #0006)}
.ghost{display:flex;align-items:center;gap:6px;position:fixed;z-index:30;pointer-events:none;padding:8px 14px;border-radius:10px;background:var(--card);border:1.5px solid var(--ac);font-weight:700;transform:translate(-50%,-130%);box-shadow:0 6px 18px #0004}
.pitchwrap.over{outline:3px solid var(--ac)}
.pp{display:flex;flex-wrap:wrap;gap:8px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:9;box-shadow:0 4px 16px #0004}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
</style>
</head>

    m.innerHTML=`<button class="back" data-go="list">‹ Zurück</button><h2 style="font-size:32px">Übung bauen</h2><div style="display:flex;gap:8px;margin:8px 0"><input type="text" id="nm" placeholder="Name der Übung" value="${esc(ed.d.name)}" style="width:50%;min-width:0"><select id="cat" aria-label="Kategorie" style="flex:1;min-width:0;width:auto"><option value="">Kategorie …</option>${CATS.map(c=>`<option ${catOf(ed.d)===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="tools" id="tools"></div><div class="colors" id="colors"></div><div class="big ed"></div><p class="meta" id="hint" style="margin:4px 0"></p><div id="s0box"></div><div class="row"><button class="btn" data-play>${playing?'⏸ Pause':'▶ Vorschau'}</button><button class="btn" data-undo>↩ Rückgängig</button><button class="btn danger" data-clearall>Alles löschen</button><select data-speed aria-label="Tempo">${[['Langsam',40],['Normal',70],['Schnell',110]].map(([l,v])=>`<option value="${v}" ${v===speed?'selected':''}>${l}</option>`).join('')}</select><label class="meta">Minuten <input type="number" id="mn" min="1" max="120" value="${ed.d.min}"></label></div><label class="meta" for="nt">Notizen / Übungsbeschreibung</label><textarea id="nt" rows="5" placeholder="Beschreibe die Übung: Ablauf, Hinweise, Regeln …" style="margin-top:4px">${esc(ed.d.notes||'')}</textarea>`;
    redraw();return;
  }else if(view==='team'){
    const P=S.team.players,ep=pedit>=0?P[pedit]:null;
    const rows=POS.map(pos=>{const L=P.map((q,i)=>({q,i})).filter(o=>o.q.pos===pos).sort((a,b)=>(a.q.num===''?999:+a.q.num)-(b.q.num===''?999:+b.q.num));return L.length?`<h2 class="grp">${pos} (${L.length})</h2>`+L.map(o=>`<div class="pl"><span class="num ${o.q.num===''?'none':''}">${o.q.num===''?'–':esc(o.q.num)}</span><span class="nm">${esc(o.q.name)}${o.q.sub?` <span class="sub">${esc(o.q.sub)}</span>`:''}</span><button class="btn" data-pedit="${o.i}">Ändern</button><button class="btn danger" data-pdel="${o.i}" aria-label="${esc(o.q.name)} entfernen">×</button></div>`).join(''):''}).join('');
    m.innerHTML=`<label class="meta" for="tn">Name deiner Mannschaft</label><input type="text" id="tn" placeholder="z. B. SV Musterstadt" value="${esc(S.team.name)}" style="margin:4px 0 14px"><h2>${ep?'Spieler ändern':'Spieler eintragen'}</h2><div class="form"><input type="text" id="pn" placeholder="Name" value="${ep?esc(ep.name):''}" autocomplete="off"><div class="one"><div class="gsel" id="pgen" role="group" aria-label="Junge oder Mädchen"><button type="button" data-pg="m" class="${pgv==='m'?'on':''}"><svg viewBox="-16 -23 32 46"><use href="#pimg"/></svg>Junge</button><button type="button" data-pg="w" class="${pgv==='w'?'on':''}"><svg viewBox="-16 -23 32 46"><use href="#gimg"/></svg>Mädchen</button></div><input type="number" id="pnum" placeholder="Nr." style="width:54px;flex:none" min="0" max="99" inputmode="numeric" value="${ep?esc(ep.num):''}"><select id="pp" aria-label="Position">${POS.map(x=>`<option ${ep&&ep.pos===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="skin" id="pskin" ${pgv?'':'hidden'}><span class="meta">Hautfarbe</span>${[['Hell','#f4b985'],['Mittel','#d6965f'],['Dunkel','#704428']].map(([l,c],i)=>`<button type="button" data-sk="${i}" class="${pskv===i?'on':''}"><i style="background:${c}"></i>${l}</button>`).join('')}</div><select id="ps" aria-label="Unterposition" ${SUB[ep?ep.pos:POS[0]]?'':'hidden'}>${subOpts(ep?ep.pos:POS[0],ep&&ep.sub)}</select>${pmsg?`<p class="warn">${pmsg}</p>`:''}<button class="cta" data-padd style="margin:0">${ep?'Speichern':'Spieler hinzufügen'}</button>${ep?'<button class="btn" data-pcancel>Abbrechen</button>':''}</div>${P.length?`<p class="meta">${P.length} Spieler im Kader</p>${rows}`:'<p class="meta">Noch keine Spieler. Trage oben den ersten Spieler ein.</p>'}`;
  }else if(view==='lineup'){
    const P=S.team.players,fm=S.lineup.fmt||'',F=FMT[fm];
    if(!P.length){m.innerHTML=`<p class="meta" style="text-align:center">Noch keine Spieler. Lege zuerst im Reiter „Mannschaft“ Spieler an.</p><button class="cta" data-go="team">Zur Mannschaft</button>`}
    else{m.innerHTML=`<div class="sel2"><div><label class="meta" for="fmt">Spielformat</label><select id="fmt" data-fmt="1"><option value="">Bitte wählen …</option>${Object.keys(FMT).map(k=>`<option value="${k}" ${fm===k?'selected':''}>${k} vs. ${k}</option>`).join('')}</select></div><div><label class="meta" for="frm">Formation</label><select id="frm" data-form="1" ${F?'':'disabled'}><option value="">${F?'Formation wählen …':'Erst Spielformat wählen'}</option>${F?Object.keys(F.forms).map(f=>`<option ${S.lineup.form===f?'selected':''}>${f}</option>`).join(''):''}</select></div></div><div class="row" style="justify-content:center"><button class="btn" data-lclr>${lclr?'Wirklich leeren?':'Feld leeren'}</button></div><div class="pitchwrap" id="pbox"></div><div id="lsel"></div><div id="bench"></div>`;drawLU()}
  }else if(view==='cal'){
    m.innerHTML=calHtml();
  }else if(view==='day'){
    m.innerHTML=dayHtml();
  }else{
    m.innerHTML=weekHtml();
  }
  startAnim();
}

let edrag=null,editNoClick=0;
function hitIdx(x,y){const it=ed.d.items;for(let i=it.length-1;i>=0;i--){const o=it[i];let h;
  if(o.t==='g')h=Math.abs(x-o.x)<=48&&y>=o.y-46&&y<=o.y+4;
  else if(o.t==='w')h=Math.abs(x-o.x)<=62&&Math.abs(y-o.y)<=8;
  else if(o.t==='p'||o.t==='k')h=Math.abs(x-o.x)<=13&&y>=o.y-44&&y<=o.y+5;
  else if(o.t==='b')h=Math.hypot(o.x-x,o.y-y)<=10;
  else if(o.t==='h')h=Math.abs(x-o.x)<=11&&Math.abs(y-o.y)<=7;
  else if(o.t==='r')h=Math.abs(x-o.x)<=13&&Math.abs(y-o.y)<=9;
  else if(o.t==='l')h=(o.o==='v'?Math.abs(x-o.x)<=9&&Math.abs(y-o.y)<=40:Math.abs(x-o.x)<=40&&Math.abs(y-o.y)<=9);
  else if(o.t==='s')h=Math.abs(x-o.x)<=7&&y>=o.y-31&&y<=o.y+4;
  else h=Math.hypot(o.x-x,o.y-y)<=13;
  if(h)return i}return -1}
document.addEventListener('pointerdown',ev=>{
  if(view!=='edit'||!ed||ev.button>0||ed.tool==='del')return;
  const bx=ev.target.closest&&ev.target.closest('.big.ed');if(!bx)return;
  const r=bx.querySelector('svg').getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*300,y=(ev.clientY-r.top)/r.height*190,i=hitIdx(x,y);
  if(i<0)return;
  edrag={i,sx:ev.clientX,sy:ev.clientY,dx:ed.d.items[i].x-x,dy:ed.d.items[i].y-y,moved:false,box:bx};
});
document.addEventListener('pointermove',ev=>{
  if(!edrag)return;
  if(!edrag.moved){
    if(Math.hypot(ev.clientX-edrag.sx,ev.clientY-edrag.sy)<5)return;
    edrag.moved=true;snap();
    if(playing){playing=false;cancelAnimationFrame(raf);const pb=document.querySelector('[data-play]');if(pb)pb.textContent='▶ Vorschau'}
  }
  const r=edrag.box.querySelector('svg').getBoundingClientRect(),o=ed.d.items[edrag.i];if(!o)return;
  o.x=Math.round(clampN((ev.clientX-r.left)/r.width*300+edrag.dx,4,296));
  o.y=Math.round(clampN((ev.clientY-r.top)/r.height*190+edrag.dy,4,186));
  if(o.path)ed.sel=edrag.i;
  redraw();
});
const endEDrag=()=>{if(!edrag)return;if(edrag.moved)editNoClick=Date.now();edrag=null};
document.addEventListener('pointerup',endEDrag);document.addEventListener('pointercancel',endEDrag);
let tt=0;function toast(m){let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';e.className='toast';e.setAttribute('role','status');document.body.appendChild(e)}e.textContent=m;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{e.hidden=true},1800)}
document.addEventListener('click',ev=>{
  if(Date.now()-noClick<400&&ev.target.closest('[data-ladd]'))return;
  const bx=ev.target.closest('.big.ed');if(bx&&view==='edit'){if(editNoClick){const dt=Date.now()-editNoClick;editNoClick=0;if(dt<60)return}board(ev,bx);return}
  const t=ev.target.closest('[data-go],[data-open],[data-new],[data-tool],[data-col],[data-rcol],[data-hcol],[data-ori],[data-play],[data-clearall],[data-calnav],[data-calday],[data-calmark],[data-dadd],[data-dup],[data-ddown],[data-ddel],[data-dpick],[data-dclear],[data-catopen],[data-catback],[data-undo],[data-save],[data-done],[data-edit],[data-copy],[data-del],[data-rm],[data-reset],[data-padd],[data-pg],[data-sk],[data-pedit],[data-pdel],[data-pcancel],[data-tsave],[data-ladd],[data-lres],[data-lrem],[data-lclr]');if(!t)return;
  const d=t.dataset;
  if('tool' in d){ed.tool=d.tool;redraw();return}
  if('col' in d){ed.col=d.col;redraw();return}
  if('rcol' in d){ed.rcol=d.rcol;redraw();return}
  if('hcol' in d){ed.hcol=d.hcol;redraw();return}
  if('ori' in d){ed.ori=d.ori;redraw();return}
  if('go' in d){if(t.classList.contains('tab')||t.id==='home')catv=null;if(d.go==='cal'||t.classList.contains('tab'))calPick=false;pgv='';pskv=0;view=d.go;askDel=0;pedit=-1;pmsg='';lsel=null;lclr=0}
  else if('open' in d){cur=byId(d.open);view='detail';playing=true;askDel=0;scrollTo(0,0)}
  else if('new' in d){ed={d:{id:'u'+Date.now(),name:'',min:10,steps:[],items:[G(150,50)]},tool:'p',sel:-1};view='edit';playing=false}
  else if('catopen' in d){catv=d.catopen;scrollTo(0,0)}
  else if('catback' in d){catv=null;scrollTo(0,0)}
  else if('calmark' in d){calMark=!calMark}
  else if('calday' in d&&calMark){const P=dayPlan(d.calday);P.train=!P.train;if(!P.train&&!P.items.length&&!P.note&&!P.start)delete S.cal[d.calday];save()}
  else if('calday' in d){calD=d.calday;calPick=false;view='day';scrollTo(0,0);{const [yy,mm]=calD.split('-').map(Number);calM={y:yy,m:mm-1}}}
  else if('dpick' in d){calPick=!calPick}
  else if('dadd' in d){const e=byId(d.dadd);if(e&&dayPlan(calD).items.length>=6){toast('Maximal 6 Übungen pro Training')}else if(e){dayPlan(calD).items.push({id:e.id,min:r5(e.min||10)});save();toast('Übung hinzugefügt')}}
  else if('dup' in d){const L=dayPlan(calD).items,i=+d.dup;if(i>0){[L[i-1],L[i]]=[L[i],L[i-1]];save()}}
  else if('ddown' in d){const L=dayPlan(calD).items,i=+d.ddown;if(i<L.length-1){[L[i+1],L[i]]=[L[i],L[i+1]];save()}}
  else if('ddel' in d){dayPlan(calD).items.splice(+d.ddel,1);save()}
  else if('dclear' in d){delete S.cal[calD]}
  else if('calnav' in d){const n=+d.calnav;if(!n)calM={y:now0.getFullYear(),m:now0.getMonth()};else{calM.m+=n;if(calM.m<0){calM.m=11;calM.y--}if(calM.m>11){calM.m=0;calM.y++}}}
  else if('undo' in d){ed.d.notes=$('nt')?$('nt').value:ed.d.notes;ed.d.cat=$('cat')?$('cat').value:ed.d.cat;ed.d.name=$('nm').value;ed.d.min=+$('mn').value||10;const cur=JSON.stringify(ed.d.items);let h=ed.hist||[],p;while(h.length){p=h.pop();if(p!==cur){ed.d.items=JSON.parse(p);ed.sel=-1;break}}}
  else if('clearall' in d){snap();ed.d.notes=$('nt')?$('nt').value:ed.d.notes;ed.d.cat=$('cat')?$('cat').value:ed.d.cat;ed.d.name=$('nm').value;ed.d.min=+$('mn').value||10;ed.d.items=[];ed.sel=-1;playing=false}
  else if('play' in d){playing=!playing;if(view==='edit'){ed.d.notes=$('nt')?$('nt').value:ed.d.notes;ed.d.cat=$('cat')?$('cat').value:ed.d.cat;ed.d.name=$('nm').value;ed.d.min=+$('mn').value||10}}
  else if('edit' in d){ed={d:clone(cur),tool:'path',sel:-1};view='edit';playing=false}
  else if('copy' in d){ed={d:Object.assign(clone(cur),{id:'u'+Date.now(),name:cur.name+' (Kopie)'}),tool:'path',sel:-1};delete ed.d.pre;view='edit';playing=false}
  else if('save' in d){
    const n=ed.d;n.notes=$('nt')?$('nt').value:(n.notes||'');n.cat=$('cat')?$('cat').value:(n.cat||'');n.name=$('nm').value.trim()||'Meine Übung';n.min=+$('mn').value||10;n.steps=n.steps||[];
    if(!n.items.length){$('hint').textContent='Setze zuerst mindestens ein Objekt aufs Feld.';return}
    const i=S.mine.findIndex(e=>e.id===n.id);if(i>=0)S.mine[i]=n;else S.mine.unshift(n);save();view='list';catv=catOf(n);toast('Übung gespeichert');
  }
  else if('done' in d){S.log[d.done]=(S.log[d.done]||0)+1;save()}
  else if('del' in d){if(!askDel){askDel=1;render();return}S.mine=S.mine.filter(e=>e.id!==cur.id);save();view='list';askDel=0}
  else if('rm' in d){const[day,i]=d.rm.split('|');S.plan[day]=(S.plan[day]||[]).filter(byId).filter((_,j)=>j!==+i);save()}
  else if('reset' in d){S.days={};save()}
  else if('pg' in d){pgv=d.pg;document.querySelectorAll('[data-pg]').forEach(b=>b.classList.toggle('on',b.dataset.pg===pgv));pmsg='';{const sr=$('pskin');if(sr)sr.hidden=false}const w=document.querySelector('.form .warn');if(w)w.remove();return}
  else if('sk' in d){pskv=+d.sk;document.querySelectorAll('[data-sk]').forEach(b=>b.classList.toggle('on',+b.dataset.sk===pskv));return}
  else if('padd' in d){
    const nm=$('pn').value.trim(),nu=$('pnum').value.trim(),po=$('pp').value;
    if(!nm){pmsg='Bitte einen Namen eingeben.';render();$('pn').focus();return}
    if(!pgv){pmsg='Bitte Junge oder Mädchen auswählen.';render();return}
    if(nu!==''&&S.team.players.some((q,i)=>i!==pedit&&q.num===nu)){pmsg='Die Nummer '+esc(nu)+' ist schon vergeben.';render();$('pnum').focus();return}
    const o={name:nm,num:nu,pos:po,sub:subVal(),g:pgv||'m',sk:pskv};if(pedit>=0){o.id=S.team.players[pedit].id;S.team.players[pedit]=o}else S.team.players.push(o);
    pedit=-1;pmsg='';pgv='';pskv=0;save();render();$('pn').focus();return}
  else if('tsave' in d){
    S.team.name=$('tn')?$('tn').value:S.team.name;
    const nm=$('pn')?$('pn').value.trim():'',nu=$('pnum')?$('pnum').value.trim():'',po=$('pp')?$('pp').value:POS[0];
    if(nm){
      if(!pgv){pmsg='Bitte Junge oder Mädchen auswählen.';render();return}
      if(nu!==''&&S.team.players.some((q,i)=>i!==pedit&&q.num===nu)){pmsg='Die Nummer '+esc(nu)+' ist schon vergeben.';render();$('pnum').focus();return}
      const o={name:nm,num:nu,pos:po,sub:subVal(),g:pgv||'m',sk:pskv};if(pedit>=0){o.id=S.team.players[pedit].id;S.team.players[pedit]=o}else S.team.players.push(o);pedit=-1;pmsg='';pgv='';pskv=0}
    save();setTitle();render();toast('Gespeichert');return}
  else if('ladd' in d){const q=S.team.players.find(x=>x.id===d.ladd),fm=S.lineup.fmt,np=S.team.players.filter(x=>S.lineup.pos[x.id]).length;
    if(!fm)toast('Bitte zuerst das Spielformat wählen');
    else if(np>=+fm)toast('Beim '+fm+' vs. '+fm+' stehen höchstens '+fm+' Spieler auf dem Feld');
    else if(q){delete S.lineup.res[q.id];S.lineup.pos[q.id]=autoSpot(q);lsel=q.id;save()}}
  else if('lrem' in d){if(lsel){delete S.lineup.pos[lsel];delete S.lineup.res[lsel];lsel=null;save();toast('Auf die Ersatzbank gesetzt')}}
  else if('lres' in d){if(lsel){delete S.lineup.pos[lsel];S.lineup.res[lsel]=true;lsel=null;save();toast('In die Reserve gesetzt')}}
  else if('lclr' in d){if(!lclr){lclr=1;render();return}S.lineup.pos={};S.lineup.form='';lsel=null;lclr=0;save()}
  else if('pedit' in d){pedit=+d.pedit;pmsg='';pgv=S.team.players[pedit].g||'m';pskv=S.team.players[pedit].sk||0;render();scrollTo(0,0);return}
  else if('pcancel' in d){pedit=-1;pmsg='';pgv='';pskv=0}
  else if('pdel' in d){S.team.players.splice(+d.pdel,1);pedit=-1;save()}
  render();
});
document.addEventListener('input',ev=>{if(ev.target.id==='dnote'){dayPlan(calD).note=ev.target.value;save();return}
  if(ev.target.id==='club'){S.team.name=ev.target.value;save();setTitle();const t=$('tn');if(t)t.value=ev.target.value;return}
  if(ev.target.id==='youth'){S.team.youth=ev.target.value;save();return}
  if(ev.target.id==='s0'&&ed&&ed.sel>=0){const it=ed.d.items[ed.sel];if(it){snap();it.s0=Math.max(1,Math.min(30,Math.round(+ev.target.value)||1));document.querySelector('.big').innerHTML=svgOf(ed.d,ed.sel);startAnim()}return}
  if(ev.target.id==='tn'){S.team.name=ev.target.value;save();setTitle();const c=$('club');if(c)c.value=ev.target.value}});
document.addEventListener('change',ev=>{
  const c=ev.target;
  if(c.dataset.dtrain!==undefined){const P=dayPlan(calD);P.train=c.checked;if(!P.train&&!P.items.length&&!P.note&&!P.start)delete S.cal[calD];save();render()}
  else if(c.id==='dsh'||c.id==='dsm'){const P=dayPlan(calD),h=$('dsh').value,mi=$('dsm').value;P.start=h===''?'':h+':'+(mi===''?'00':mi);save();render()}
  else if(c.id==='dtotal'){dayPlan(calD).total=Math.max(0,Math.min(600,Math.round(+c.value)||0));save();render()}
  else if(c.dataset.dmin!==undefined){const it=dayPlan(calD).items[+c.dataset.dmin];if(it){it.min=r5(c.value);save();render()}}
  else if(c.dataset.day){S.days[c.dataset.day]=c.checked;save();render()}
  else if(c.dataset.add!==undefined){if(c.value){const day=c.dataset.add;S.plan[day]=(S.plan[day]||[]).filter(byId).concat(c.value);save()}render()}
  else if(c.dataset.speed!==undefined){speed=+c.value;startAnim()}
  else if(c.id==='pp'){const e=$('ps');if(e){e.hidden=!SUB[c.value];e.innerHTML=subOpts(c.value,'')}}
  else if(c.dataset.fmt!==undefined){S.lineup.fmt=c.value;S.lineup.form='';const n=+c.value||0;if(n){Object.keys(S.lineup.pos).filter(id=>S.team.players.some(q=>q.id===id)).slice(n).forEach(id=>delete S.lineup.pos[id])}save();render()}
  else if(c.dataset.form!==undefined){if(c.value){applyForm(c.value);lsel=null;drawLU()}}
});
render();
